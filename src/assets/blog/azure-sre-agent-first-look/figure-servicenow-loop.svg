<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 690"
  class="sd-root"
  role="img"
  aria-labelledby="sreLoopTitle sreLoopDesc"
>
  <title id="sreLoopTitle">
    The incident loop Azure SRE Agent closes with ServiceNow
  </title>
  <desc id="sreLoopDesc">
    A five-stage cycle. One: an alert fires when Azure Monitor detects the
    service level indicator breach. Two: a ticket is raised, the agent creating
    or acknowledging a ServiceNow incident under its own service identity and
    posting running updates into the discussion thread. Three: investigation,
    correlating metrics, application logs and recent deployment history to find
    the root cause. Four: remediation, where the response plan runs and, if set
    to autonomous, acts without waiting for approval. Five: verification and
    closure, watching the indicator until recovery holds, writing the root cause
    into the incident notes and closing the ticket. An arrow returns from stage
    five to stage one, closing the loop. Setup requires a ServiceNow user with
    the itil or admin role, or a registered OAuth application, plus Contributor
    on the Azure SRE Agent resource.
  </desc>

  <defs>
    <marker
      id="sreLoopArrow"
      markerWidth="9"
      markerHeight="9"
      refX="7"
      refY="3"
      orient="auto"
      markerUnits="strokeWidth"
    >
      <path d="M0 0 L7 3 L0 6 Z" class="sd-arrowhead"></path>
    </marker>
  </defs>

  <text x="12" y="26" font-size="19" font-weight="700" class="sd-title">
    The loop that connecting Incidents closes
  </text>
  <text x="12" y="50" font-size="13" class="sd-muted">
    Alert in, ticket raised, investigation, mitigation, ticket closed with the
    root cause written back.
  </text>

  <!-- Return path: stage 5 back to stage 1 -->
  <path
    d="M96 570 H48 V114 H88"
    class="sd-rule"
    stroke-width="1.5"
    stroke-linejoin="round"
    stroke-dasharray="5 5"
    marker-end="url(#sreLoopArrow)"></path>
  <text
    x="36"
    y="342"
    font-size="11.5"
    class="sd-muted"
    text-anchor="middle"
    transform="rotate(-90 36 342)">the loop closes</text
  >

  <!-- 1. Alert fires -->
  <g class="sd-blue">
    <rect
      x="96"
      y="72"
      width="652"
      height="84"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"></rect>
    <circle cx="130" cy="114" r="17" class="sd-fill"></circle>
    <text
      x="130"
      y="119"
      font-size="15"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">1</text
    >
    <text x="166" y="106" font-size="14.5" font-weight="700" class="sd-title">
      Alert fires
    </text>
    <text x="166" y="130" font-size="12.5" class="sd-body">
      Azure Monitor detects the service level indicator breach and fires a Sev1
      alert.
    </text>
  </g>

  <!-- 2. Ticket raised -->
  <g class="sd-purple">
    <rect
      x="96"
      y="174"
      width="652"
      height="84"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"></rect>
    <circle cx="130" cy="216" r="17" class="sd-fill"></circle>
    <text
      x="130"
      y="221"
      font-size="15"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">2</text
    >
    <text x="166" y="202" font-size="14.5" font-weight="700" class="sd-title">
      Ticket raised
    </text>
    <text font-size="12.5" class="sd-body">
      <tspan x="166" y="226"
        >Creates or acknowledges a ServiceNow incident under its own service
        identity,</tspan
      >
      <tspan x="166" y="244"
        >then posts running updates into the discussion thread as it works.</tspan
      >
    </text>
  </g>

  <!-- 3. Investigation -->
  <g class="sd-amber">
    <rect
      x="96"
      y="276"
      width="652"
      height="84"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"></rect>
    <circle cx="130" cy="318" r="17" class="sd-fill"></circle>
    <text
      x="130"
      y="323"
      font-size="15"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">3</text
    >
    <text x="166" y="310" font-size="14.5" font-weight="700" class="sd-title">
      Investigation
    </text>
    <text x="166" y="334" font-size="12.5" class="sd-body">
      Correlates metrics, application logs, and recent deployment history to find
      the root cause.
    </text>
  </g>

  <!-- 4. Remediation -->
  <g class="sd-teal">
    <rect
      x="96"
      y="378"
      width="652"
      height="84"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"></rect>
    <circle cx="130" cy="420" r="17" class="sd-fill"></circle>
    <text
      x="130"
      y="425"
      font-size="15"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">4</text
    >
    <text x="166" y="412" font-size="14.5" font-weight="700" class="sd-title">
      Remediation
    </text>
    <text x="166" y="436" font-size="12.5" class="sd-body">
      The response plan runs. Set to autonomous, it acts without waiting for a
      human to approve.
    </text>
  </g>

  <!-- 5. Verification and closure -->
  <g class="sd-green">
    <rect
      x="96"
      y="480"
      width="652"
      height="84"
      rx="12"
      class="sd-tint"
      stroke-width="1.5"></rect>
    <circle cx="130" cy="522" r="17" class="sd-fill"></circle>
    <text
      x="130"
      y="527"
      font-size="15"
      font-weight="700"
      class="sd-onfill"
      text-anchor="middle">5</text
    >
    <text x="166" y="508" font-size="14.5" font-weight="700" class="sd-title">
      Verification and closure
    </text>
    <text font-size="12.5" class="sd-body">
      <tspan x="166" y="532"
        >Watches the indicator until recovery holds, writes the root cause into
        the incident</tspan
      >
      <tspan x="166" y="550">notes, and closes the ticket.</tspan>
    </text>
  </g>

  <!-- Setup footnote -->
  <rect
    x="96"
    y="596"
    width="652"
    height="72"
    rx="12"
    class="sd-panel"
    stroke-width="1.5"></rect>
  <text x="118" y="622" font-size="12.5" font-weight="700" class="sd-title">
    What the connection needs
  </text>
  <text font-size="12" class="sd-muted">
    <tspan x="118" y="642"
      >A ServiceNow user with the itil or admin role for basic authentication, or
      a registered</tspan
    >
    <tspan x="118" y="658"
      >OAuth application, plus Contributor on the Azure SRE Agent resource.</tspan
    >
  </text>
</svg>
