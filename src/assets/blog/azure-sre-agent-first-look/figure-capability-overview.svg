<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 760 480"
  class="sd-root"
  role="img"
  aria-labelledby="sreOverviewTitle sreOverviewDesc"
>
  <title id="sreOverviewTitle">Azure SRE Agent at a glance</title>
  <desc id="sreOverviewDesc">
    Four panels summarising Azure SRE Agent. Core capabilities: investigates on
    its own around the clock, correlates logs, metrics, traces and deployments,
    six built-in subagents, and turns findings into durable knowledge.
    Governance and security: per-tool Allow or Ask policy, managed identity and
    Azure RBAC, VNet integration in preview, and approval required before it
    deploys anything. Context and integrations: source code grounding for GitHub
    and Azure DevOps, Application Insights and Log Analytics connectors, MCP
    servers with custom skills and plugins, and Live Reports authored by
    chatting. Switches you turn on yourself: workspace tools for file and shell
    access, its own knowledge directory, repository access which produces an
    SREAGENT.md pull request, and a scheduled task on whatever keeps breaking.
  </desc>

  <text x="12" y="26" font-size="19" font-weight="700" class="sd-title">
    Azure SRE Agent at a glance
  </text>
  <text x="12" y="50" font-size="13" class="sd-muted">
    What it does, how you govern it, and what you have to switch on yourself.
  </text>

  <!-- Core capabilities -->
  <g class="sd-blue">
    <rect
      x="12"
      y="80"
      width="356"
      height="182"
      rx="14"
      class="sd-tint"
      stroke-width="1.5"></rect>
    <circle cx="34" cy="110" r="5" class="sd-fill"></circle>
    <text x="48" y="115" font-size="14" font-weight="700" class="sd-fill">
      Core capabilities
    </text>
    <text font-size="13" class="sd-body">
      <tspan x="34" y="148">Investigates on its own, around the clock</tspan>
      <tspan x="34" y="176">Correlates logs, metrics, traces, deploys</tspan>
      <tspan x="34" y="204">Six built-in subagents</tspan>
      <tspan x="34" y="232">Turns findings into durable knowledge</tspan>
    </text>
  </g>

  <!-- Governance and security -->
  <g class="sd-purple">
    <rect
      x="392"
      y="80"
      width="356"
      height="182"
      rx="14"
      class="sd-tint"
      stroke-width="1.5"></rect>
    <circle cx="414" cy="110" r="5" class="sd-fill"></circle>
    <text x="428" y="115" font-size="14" font-weight="700" class="sd-fill">
      Governance and security
    </text>
    <text font-size="13" class="sd-body">
      <tspan x="414" y="148">Per-tool policy: Allow or Ask</tspan>
      <tspan x="414" y="176">Managed identity and Azure RBAC</tspan>
      <tspan x="414" y="204">VNet integration (preview)</tspan>
      <tspan x="414" y="232">Approval required before it deploys</tspan>
    </text>
  </g>

  <!-- Context and integrations -->
  <g class="sd-teal">
    <rect
      x="12"
      y="286"
      width="356"
      height="182"
      rx="14"
      class="sd-tint"
      stroke-width="1.5"></rect>
    <circle cx="34" cy="316" r="5" class="sd-fill"></circle>
    <text x="48" y="321" font-size="14" font-weight="700" class="sd-fill">
      Context and integrations
    </text>
    <text font-size="13" class="sd-body">
      <tspan x="34" y="354">Source code grounding: GitHub, Azure DevOps</tspan>
      <tspan x="34" y="382">App Insights and Log Analytics connectors</tspan>
      <tspan x="34" y="410">MCP servers, custom skills, plugins</tspan>
      <tspan x="34" y="438">Live Reports you author by chatting</tspan>
    </text>
  </g>

  <!-- Switches you turn on yourself -->
  <g class="sd-amber">
    <rect
      x="392"
      y="286"
      width="356"
      height="182"
      rx="14"
      class="sd-tint"
      stroke-width="1.5"></rect>
    <circle cx="414" cy="316" r="5" class="sd-fill"></circle>
    <text x="428" y="321" font-size="14" font-weight="700" class="sd-fill">
      Switches you turn on yourself
    </text>
    <text font-size="13" class="sd-body">
      <tspan x="414" y="354">Workspace tools (file and shell access)</tspan>
      <tspan x="414" y="382">Its own knowledge directory</tspan>
      <tspan x="414" y="410">Repo access, which yields SREAGENT.md</tspan>
      <tspan x="414" y="438">A scheduled task on what keeps breaking</tspan>
    </text>
  </g>
</svg>
